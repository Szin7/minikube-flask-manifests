apiVersion: apps/v1
kind: Deployment
metadata:
  name: minikube-flask-app
  labels:
    app: minikube-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minikube-flask-app
  template:
    metadata:
      labels:
        app: minikube-flask-app
    spec:
      containers:
        - name: flask
          image: syjinxz77/minikube-flask-app:38c5571
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi